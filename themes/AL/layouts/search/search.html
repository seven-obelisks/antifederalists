{{ define "main" }}


<div class="page-white search-results">
  <h1>Search the Library</h1>

  <form id="page-search-form">
    <input
      id="page-search-box"
      name="q"
      type="text"
      placeholder="Type to search…"
      autofocus
    >
    <button type="submit" class="search-button-inside">Search</button>
  </form>

  <div id="loading" style="display:none;">🔄 Searching the library…</div>
  <div class="results-list"><ul id="results"></ul></div>

  <script src="https://cdn.jsdelivr.net/npm/lunr/lunr.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const searchBox = document.getElementById("page-search-box");
      const resultsList = document.getElementById("results");
      const form = document.getElementById("page-search-form");
      const loading = document.getElementById("loading");
      const MIN_LOAD_TIME = 2000;

      const params = new URLSearchParams(window.location.search);
      const queryParam = params.get("q") || "";
      searchBox.value = queryParam;

      let store = [];

      // Fetch the JSON using relative path and handle errors
      fetch("./index.json")
        .then(res => {
          if (!res.ok) throw new Error("Failed to fetch index.json");
          return res.json();
        })
        .then(data => {
          store = Array.isArray(data) ? data : [];
          if (queryParam) runSearch(queryParam);
        })
        .catch(() => {
          resultsList.innerHTML = "<li>Search unavailable.</li>";
        });

      form.addEventListener("submit", function (e) {
        e.preventDefault();
        const q = searchBox.value.trim();
        if (!q) return;
        runSearch(q);
        const newUrl = new URL(window.location.href);
        newUrl.searchParams.set("q", q);
        window.history.replaceState({}, "", newUrl);
      });

      function runSearch(query) {
        resultsList.innerHTML = "";
        loading.style.display = "block";
        const startTime = Date.now();
        const lowerQuery = query.toLowerCase();

        // Safe filtering
        const results = (store || []).filter(item =>
          (item?.title?.toLowerCase().includes(lowerQuery)) ||
          (item?.summary?.toLowerCase().includes(lowerQuery)) ||
          (item?.content?.toLowerCase().includes(lowerQuery))
        );

        const renderResults = () => {
          results.forEach(item => {
            const snippet = extractSnippet(item, query, 100);
            const li = document.createElement("li");
            li.innerHTML = `<a href="${item.url || '#'}">${item.title || 'Untitled'}</a><p>${snippet}</p>`;
            resultsList.appendChild(li);
          });
          if (results.length === 0) resultsList.innerHTML = "<li>No results found.</li>";
          loading.style.display = "none";
        };

        const elapsed = Date.now() - startTime;
        const delay = Math.max(MIN_LOAD_TIME - elapsed, 0);
        setTimeout(renderResults, delay);
      }

      function extractSnippet(item, query, contextLength) {
        const lowerQuery = query.toLowerCase();
        let text = item?.content || item?.summary || item?.title || "";
        if (!text) return "";

        const lowerText = text.toLowerCase();
        const index = lowerText.indexOf(lowerQuery);
        if (index === -1) return text.substring(0, contextLength) + (text.length > contextLength ? "…" : "");

        const start = Math.max(0, index - contextLength);
        const end = Math.min(text.length, index + query.length + contextLength);
        const snippet = text.substring(start, end);
        const highlighted = snippet.replace(new RegExp(`(${query})`, 'gi'), '<strong>$1</strong>');
        return (start > 0 ? "…" : "") + highlighted + (end < text.length ? "…" : "");
      }
    });
  </script>
</div>

{{ end }}
