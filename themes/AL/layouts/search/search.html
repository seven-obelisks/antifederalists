{{ define "main" }}
<div class="page-white search-results">
  <h1>Search the Library</h1>

  <form id="page-search-form">
    <input
      id="page-search-box"
      name="q"
      type="text"
      placeholder="Type to search…"
      autofocus
    >
    <button type="submit" class="search-button-inside">Search</button>
  </form>

  <div id="loading" style="display:none;">🔄 Searching the library…</div>
  <div class="results-list"><ul id="results"></ul></div>
</div>
{{ end }}
