<!DOCTYPE html>
<html lang="{{ site.Language.Locale }}" dir="{{ or site.Language.Direction `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body class="{{ if .IsHome }}is-home{{ else if .IsPage }}is-page{{ else }}is-list{{ end }}">
  <a class="skip-link" href="#main-content">Skip to content</a>
  {{ partial "header.html" . }}
  <main id="main-content" tabindex="-1">
    {{ block "main" . }}{{ end }}
  </main>
  {{ partial "footer.html" . }}
  {{ partialCached "head/js.html" . }}
  {{ if eq .Type "search" }}
    {{ partial "search-js.html" . }}
  {{ end }}
</body>
</html>
