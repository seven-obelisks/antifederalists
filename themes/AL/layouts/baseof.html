<!DOCTYPE html>
<html lang="{{ site.Language.LanguageCode }}" dir="{{ or site.Language.LanguageDirection `ltr` }}">
<head>
  {{ partial "head.html" . }}
</head>
<body>
<div class="flex-box">
  <div class="flex1">
    <div class="sidebar">
  <header>
    {{ partial "header.html" . }}
  </header>
  <footer>
    <button id="dark-toggle" aria-label="Toggle dark mode" class="dark-toggle">
      <span id="dark-toggle-icon">Toggle</span>
    </button>
    {{ partial "footer.html" . }}
  </footer>
  </div>
  </div>
  <div class="flex2">
  <main>
    {{ block "main" . }}{{ end }}
  </main>
  </div>
</div>

</body>
</html>
