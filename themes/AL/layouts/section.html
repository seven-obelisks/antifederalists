{{ define "main" }}
  {{ partial "breadcrumbs.html" . }}
  {{ .Content }}

  {{ $sorted := sort .Pages "LinkTitle" "asc" }}
  {{ range $sorted }}
    <section class="paper-block">
      <h4><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h4>
      <section class="summaryp">{{ .Summary | truncate 750 }}</section>
    </section>
  {{ end }}
{{ end }}
