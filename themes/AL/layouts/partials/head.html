<script>
  // Immediately apply saved dark mode to reduce load delay
  try {
    if (localStorage.getItem("theme") === "dark") {
      document.body.classList.add("dark");
    }
  } catch(e) {
    // fail silently if localStorage is blocked
  }
</script>
