<!-- LUNR SEARCH LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/lunr/lunr.min.js"></script>
<!-- SEARCH LOGIC -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const searchBox = document.getElementById("page-search-box");
  const resultsList = document.getElementById("results");
  const form = document.getElementById("page-search-form");
  const loading = document.getElementById("loading");
  const MIN_LOAD_TIME = 2000;
  if (!searchBox || !resultsList || !form || !loading) {
    console.warn("Search elements not found in DOM. Search will not work.");
    return;
  }
  const params = new URLSearchParams(window.location.search);
  const queryParam = params.get("q") || "";
  searchBox.value = queryParam;
  let store = [];
  fetch("/index.json")
    .then(res => res.json())
    .then(data => {
      store = data;
      if (queryParam) runSearch(queryParam);
    })
    .catch(() => {
      resultsList.innerHTML = "<li>Search unavailable.</li>";
    });
  form.addEventListener("submit", function (e) {
    e.preventDefault();
    const q = searchBox.value.trim();
    if (!q) return;
    runSearch(q);
    const newUrl = new URL(window.location.href);
    newUrl.searchParams.set("q", q);
    window.history.replaceState({}, "", newUrl);
  });
  function normalize(str) {
    return str ? str.replace(/[\n\r]/g, " ").replace(/&[a-z]+;/gi, "").toLowerCase() : "";
  }
  function runSearch(query) {
    resultsList.innerHTML = "";
    loading.style.display = "block";
    const startTime = Date.now();
    const lowerQuery = normalize(query);
    const results = store.filter(item =>
      normalize(item.title).includes(lowerQuery) ||
      normalize(item.summary).includes(lowerQuery) ||
      normalize(item.content).includes(lowerQuery)
    );
    const renderResults = () => {
      if (results.length === 0) {
        resultsList.innerHTML = "<li>No results found.</li>";
      } else {
        const seen = new Set(); // prevent duplicates
        results.forEach(item => {
          if (seen.has(item.url)) return;
          seen.add(item.url);
          
          // Find all instances of the search term
          const snippets = extractAllSnippets(item, query, 80);
          
          const li = document.createElement("li");
          li.innerHTML = `
            <a href="${item.url}">${item.title}</a>
            <div class="snippet-container">
              ${snippets.map(snippet => `<p class="search-snippet">${snippet}</p>`).join('')}
            </div>
            <small class="match-count">${snippets.length} match${snippets.length !== 1 ? 'es' : ''} found</small>
          `;
          resultsList.appendChild(li);
        });
      }
      loading.style.display = "none";
    };
    const elapsed = Date.now() - startTime;
    const delay = Math.max(MIN_LOAD_TIME - elapsed, 0);
    setTimeout(renderResults, delay);
  }
  function extractAllSnippets(item, query, contextLength) {
    const lowerQuery = normalize(query);
    let text = "";
    
    // Determine which field contains the match
    if (normalize(item.content).includes(lowerQuery)) text = item.content;
    else if (normalize(item.summary).includes(lowerQuery)) text = item.summary;
    else if (normalize(item.title).includes(lowerQuery)) text = item.title;
    else return ["No preview available"];

    // Work with normalized text for both search and extraction
    const normalizedText = normalize(text);
    const snippets = [];
    let searchStart = 0;
    
    // Find all instances of the search term in normalized text
    while (true) {
      const index = normalizedText.indexOf(lowerQuery, searchStart);
      if (index === -1) break;
      
      const start = Math.max(0, index - contextLength);
      const end = Math.min(normalizedText.length, index + lowerQuery.length + contextLength);
      let snippet = normalizedText.substring(start, end);
      
      // Highlight the search term
      const escapedQuery = lowerQuery.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
      const highlightRegex = new RegExp(`(${escapedQuery})`, 'gi');
      snippet = snippet.replace(highlightRegex, '<strong>$1</strong>');
      
      // Add ellipsis if needed
      const prefix = start > 0 ? "…" : "";
      const suffix = end < normalizedText.length ? "…" : "";
      
      snippets.push(prefix + snippet + suffix);
      searchStart = index + lowerQuery.length;
      
      // Limit to max 5 snippets per document
      if (snippets.length >= 5) break;
    }
    
    return snippets.length > 0 ? snippets : ["Match found"];
  }
});
</script>
<!-- HAMBURGER MENU -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const button = document.getElementById("hamburger-button");
  const nav = document.getElementById("main-nav");
  if (button && nav) {
    button.addEventListener("click", function () {
      nav.classList.toggle("open");
    });
  }
});
</script>
<!-- DARK MODE -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  const toggle = document.getElementById("dark-toggle");
  const icon = document.getElementById("dark-toggle-icon");
  const savedMode = localStorage.getItem("theme");
  const lightIcon = toggle.dataset.light;
  const darkIcon = toggle.dataset.dark;
  const applyTheme = (isDark) => {
    document.body.classList.toggle("dark", isDark);
    icon.innerHTML = isDark
      ? `<img src="${lightIcon}" alt="Light Mode" width="20" style="vertical-align:middle;"><span style="position:relative; top:2px; margin-left:10px;">Light Mode</span>`
      : `<img src="${darkIcon}" alt="Dark Mode" width="20" style="vertical-align:middle;"><span style="position:relative; top:2px; margin-left:10px;">Dark Mode</span>`;
  };
  const initialDark = savedMode === "dark";
  applyTheme(initialDark);
  toggle.addEventListener("click", () => {
    const isDark = document.body.classList.toggle("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    applyTheme(isDark);
  });
});
</script>
