
{{- $js := resources.Get "js/main.js" }}
{{- if $js }}
  <script src="{{ $js.RelPermalink }}"></script>
{{- end }}

<!-- LUNR SEARCH LIBRARY -->
<script src="https://cdn.jsdelivr.net/npm/lunr/lunr.min.js"></script>

<!-- HAMBURGER MENU -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const button = document.getElementById("hamburger-button");
    const nav = document.getElementById("main-nav");
    if (button && nav) {
      button.addEventListener("click", function () {
        nav.classList.toggle("open");
      });
    }
  });
</script>

<!-- DARK MODE -->
<script>
  document.addEventListener("DOMContentLoaded", function () {
    const toggle = document.getElementById("dark-toggle");
    const icon = document.getElementById("dark-toggle-icon");
    const savedMode = localStorage.getItem("theme");

    const lightIcon = toggle.dataset.light;
    const darkIcon = toggle.dataset.dark;

    const applyTheme = (isDark) => {
      document.body.classList.toggle("dark", isDark);
      icon.innerHTML = isDark
        ? `<img src="${lightIcon}" alt="Light Mode" width="20" style="vertical-align:middle;"><span style="position:relative; top:2px; margin-left:10px;">Light Mode</span>`
        : `<img src="${darkIcon}" alt="Dark Mode" width="20" style="vertical-align:middle;"><span style="position:relative; top:2px; margin-left:10px;">Dark Mode</span>`;
    };

    const initialDark = savedMode === "dark";
    applyTheme(initialDark);

    toggle.addEventListener("click", () => {
      const isDark = document.body.classList.toggle("dark");
      localStorage.setItem("theme", isDark ? "dark" : "light");
      applyTheme(isDark);
    });
  });
</script>

<!-- SEARCH -->
<script>
document.addEventListener("DOMContentLoaded", function () {
  let idx = null;
  let store = [];

  fetch("/index.json")
    .then(res => res.json())
    .then(data => {
      store = data;

      idx = lunr(function () {
        this.ref("url");
        this.field("title");
        this.field("summary");
        this.field("content");

        data.forEach(doc => this.add(doc));
      });
    });

  const searchBox = document.getElementById("search-box");
  const resultsList = document.getElementById("results");

  if (searchBox && resultsList) {
    searchBox.addEventListener("input", function () {
      const query = this.value.trim();
      resultsList.innerHTML = "";

      if (!idx || query.length < 2) return;

      const results = idx.search(query);

      results.forEach(r => {
        const item = store.find(d => d.url === r.ref);
        if (item) {
          const li = document.createElement("li");
          li.innerHTML = `<a href="${item.url}">${item.title}</a>`;
          resultsList.appendChild(li);
        }
      });
    });
  }
});
</script>
