<!-- layouts/partials/head/js.html -->
{{ $js := resources.Get "js/main.js" }}
{{ if $js }}
  <script src="{{ $js.RelPermalink }}"></script>
{{ end }}

<script>
  document.addEventListener('DOMContentLoaded', function(){
    // Hamburger menu
    const btn = document.getElementById('hamburger-button');
    const nav = document.getElementById('main-nav');
    if (btn && nav) btn.addEventListener('click', () => nav.classList.toggle('open'));

    // Dark/light toggle
    const toggle = document.getElementById('dark-toggle');
    const icon   = document.getElementById('dark-toggle-icon');
    const lightI = toggle.dataset.light;
    const darkI  = toggle.dataset.dark;

    function updateIcon(isDark) {
      icon.innerHTML = isDark
        ? `<img src="${lightI}"  alt="Light Mode"  width="20"><span>Light Mode</span>`
        : `<img src="${darkI}"   alt="Dark Mode"   width="20"><span>Dark Mode</span>`;
    }

    // Initialize icon
    const isDark = document.documentElement.classList.contains('dark');
    updateIcon(isDark);

    // Toggle handler
    toggle.addEventListener('click', function(){
      const nowDark = document.documentElement.classList.toggle('dark');
      localStorage.setItem('theme', nowDark ? 'dark' : 'light');
      updateIcon(nowDark);
    });
  });
</script>
