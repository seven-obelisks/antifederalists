{{- $js := resources.Get "js/main.js" }}
{{- if $js }}
  <script src="{{ $js.RelPermalink }}"></script>
{{- end }}

<script>
  document.addEventListener("DOMContentLoaded", function () {
    const button = document.getElementById("hamburger-button");
    const nav = document.getElementById("main-nav");
    if (button && nav) {
      button.addEventListener("click", function () {
        nav.classList.toggle("open");
      });
    }
  });
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  const toggle = document.getElementById("dark-toggle");
  const icon = document.getElementById("dark-toggle-icon");
  const savedMode = localStorage.getItem("theme");

  const applyTheme = (isDark) => {
    document.body.classList.toggle("dark", isDark);
    icon.innerHTML = isDark
      ? '<img src="/images/lantern-light.png" alt="Light Mode" width="25" style="vertical-align:middle; "><span style="position:relative; top:2px; margin-left:10px;">Light Mode</span>'
      : '<img src="/images/lantern-dark.png" alt="Dark Mode" width="25" style="vertical-align:middle; "><span style="position:relative; top:2px; margin-left:10px;">Dark Mode</span>';
  };

  const initialDark = savedMode === "dark";
  applyTheme(initialDark);

  toggle.addEventListener("click", () => {
    const isDark = document.body.classList.toggle("dark");
    localStorage.setItem("theme", isDark ? "dark" : "light");
    icon.innerHTML = isDark
      ? '<img src="/images/lantern-light.png" alt="Light Mode" width="25" style="vertical-align:middle; "><span style="position:relative; top:2px; margin-left:10px;">Light Mode</span>'
      : '<img src="/images/lantern-dark.png" alt="Dark Mode" width="25" style="vertical-align:middle; "><span style="position:relative; top:2px; margin-left:10px;">Dark Mode</span>';
  });
});
</script>
